[project]
name = "satchel"
version = "3.0.0.dev0"
description = "Player-side D&D character companion (one SQLite file per character)"
requires-python = ">=3.14,<3.15"
dependencies = [
    "pyside6-essentials>=6.11.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1",
    "hypothesis>=6.168",
    "ruff>=0.16",
    "fonttools[woff]>=4.60",
    "pytest-qt>=4.5.0",
]

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff.lint.per-file-ignores]
# Demo data tables read best one record per line.
"tests/fixtures/demo.py" = ["E501"]
