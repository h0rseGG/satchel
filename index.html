<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Satchel</title>
  <link rel="icon" href="icons/icon-32.png" type="image/png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#E6E6E1">
  <meta name="description" content="Player notes for your D&D character: capture fast at the table, tidy up later.">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <!-- Relative paths everywhere: GitHub Pages serves this from /<repo>/, not / -->
  <link rel="stylesheet" href="css/app.css">
  <!-- Maps bare package names to the pinned files in vendor/ (preact-hooks imports "preact") -->
  <script type="importmap">
  {
    "imports": {
      "preact": "./vendor/preact.mjs",
      "preact/hooks": "./vendor/preact-hooks.mjs",
      "htm": "./vendor/htm.mjs",
      "dexie": "./vendor/dexie.mjs",
      "minisearch": "./vendor/minisearch.mjs",
      "fflate": "./vendor/fflate.mjs"
    }
  }
  </script>
</head>
<body>
  <div id="app">
    <noscript><p class="fatal">Satchel needs JavaScript.</p></noscript>
  </div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
