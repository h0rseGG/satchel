<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Satchel</title>
  <!-- Relative paths everywhere: GitHub Pages serves this from /<repo>/, not / -->
  <link rel="stylesheet" href="css/app.css">
  <!-- Maps bare package names to the pinned files in vendor/ (preact-hooks imports "preact") -->
  <script type="importmap">
  {
    "imports": {
      "preact": "./vendor/preact.mjs",
      "preact/hooks": "./vendor/preact-hooks.mjs",
      "htm": "./vendor/htm.mjs",
      "dexie": "./vendor/dexie.mjs",
      "minisearch": "./vendor/minisearch.mjs",
      "fflate": "./vendor/fflate.mjs"
    }
  }
  </script>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <span class="topbar__title">Satchel</span>
      <span class="badge badge--err">Not backed up</span>
    </header>
    <main class="results">
      <p class="muted">Skeleton build. Nothing is saved yet.</p>
    </main>
    <footer class="capture">
      <textarea class="capture__box" rows="1" placeholder="Type a note, press Enter" autofocus></textarea>
    </footer>
  </div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
